{% extends "admin/base.html" %}

{% block title %}WaterFlow Administration{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" class="wf-admin-brand">
        <span class="wf-admin-icon">W</span>
        <span class="wf-admin-name">WaterFlow</span>
        <span class="wf-admin-label">Administration</span>
    </a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
    /* =========================================================
       WATERFLOW ADMIN COLOR SYSTEM
       Matches the React frontend
       ========================================================= */

    :root {
        --wf-primary: #168aad;
        --wf-primary-dark: #126d87;

        --wf-background: #f5f7fa;
        --wf-white: #ffffff;

        --wf-text: #1f2937;
        --wf-secondary: #374151;
        --wf-muted: #6b7280;

        --wf-border: #e5e7eb;
        --wf-light-border: #f3f4f6;

        --wf-success: #15803d;
        --wf-success-light: #dcfce7;

        --wf-danger: #dc2626;
        --wf-danger-dark: #b91c1c;

        --wf-navy: #1f2937;
        --wf-light-blue: #ecfeff;
    }


    /* =========================================================
       GENERAL PAGE
       ========================================================= */

    html,
    body {
        background: var(--wf-background);
    }

    body {
        color: var(--wf-text);
    }

    a:link,
    a:visited {
        color: var(--wf-primary);
    }

    a:hover,
    a:focus {
        color: var(--wf-primary-dark);
    }


    /* =========================================================
       HEADER
       ========================================================= */

    #header {
        background: var(--wf-white);
        color: var(--wf-text);

        border-bottom: 3px solid var(--wf-primary);

        padding: 15px 28px;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    #branding {
        display: flex;
        align-items: center;
    }

    #site-name {
        margin: 0;
        padding: 0;
    }

    .wf-admin-brand {
        display: flex;
        align-items: center;
        gap: 10px;

        text-decoration: none !important;
    }

    .wf-admin-icon {
        width: 36px;
        height: 36px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 9px;

        background: var(--wf-primary);
        color: white;

        font-size: 18px;
        font-weight: 800;
    }

    .wf-admin-name {
        color: var(--wf-primary) !important;

        font-size: 23px;
        font-weight: 700;
    }

    .wf-admin-label {
        color: var(--wf-muted);

        font-size: 14px;
        font-weight: 500;

        padding-left: 3px;
    }


    /* =========================================================
       USER TOOLS
       ========================================================= */

    #user-tools {
        color: var(--wf-muted);
        font-size: 13px;
    }

    #user-tools a {
        color: var(--wf-primary) !important;
        text-decoration: none !important;
    }

    #user-tools a:hover {
        color: var(--wf-primary-dark) !important;
    }


    /* =========================================================
       BREADCRUMBS
       ========================================================= */

    div.breadcrumbs {
        background: var(--wf-white);

        color: var(--wf-muted);

        padding: 11px 28px;

        border-bottom: 1px solid var(--wf-border);
    }

    div.breadcrumbs a {
        color: var(--wf-primary) !important;
    }


    /* =========================================================
       MAIN CONTENT
       ========================================================= */

    #content {
        padding: 28px;
    }

    h1 {
        color: var(--wf-text);

        font-size: 26px;
        font-weight: 700;

        margin-bottom: 24px;
    }

    h2,
    h3 {
        color: var(--wf-text);
    }


    /* =========================================================
       ADMIN DASHBOARD MODULES
       ========================================================= */

    .module {
        background: var(--wf-white);

        border: 1px solid var(--wf-border);
        border-radius: 12px;

        overflow: hidden;

        margin-bottom: 22px;

        box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.035);
    }

    .module caption,
    .module h2 {
        background: var(--wf-primary);

        color: white !important;

        padding: 14px 18px;

        font-size: 15px;
        font-weight: 700;

        text-align: left;
    }

    .module caption a,
    .module caption a:link,
    .module caption a:visited {
        color: white !important;

        text-decoration: none !important;

        font-weight: 700;
    }

    .module caption a:hover {
        color: #dff7fa !important;
    }


    /* =========================================================
       MODEL ROWS
       ========================================================= */

    .module table {
        width: 100%;
    }

    .module th {
        color: var(--wf-text);

        font-weight: 600;

        padding: 13px 18px;
    }

    .module td {
        color: var(--wf-secondary);

        padding: 13px 18px;
    }

    .module tr {
        border-bottom: 1px solid var(--wf-light-border);
    }

    .module tr:last-child {
        border-bottom: none;
    }

    .module th a,
    .module td a {
        color: var(--wf-primary) !important;

        font-weight: 600;

        text-decoration: none !important;
    }

    .module th a:hover,
    .module td a:hover {
        color: var(--wf-primary-dark) !important;

        text-decoration: underline !important;
    }


    /* =========================================================
       ADD BUTTON
       ========================================================= */

    .addlink {
        display: inline-block;

        background: var(--wf-success) !important;

        color: white !important;

        border-radius: 7px;

        padding: 6px 11px;

        font-size: 12px;
        font-weight: 700;

        text-decoration: none !important;
    }

    .addlink:hover {
        background: #166534 !important;

        color: white !important;
    }


    /* =========================================================
       CHANGE BUTTON
       ========================================================= */

    .changelink {
        display: inline-block;

        background: var(--wf-primary) !important;

        color: white !important;

        border-radius: 7px;

        padding: 6px 11px;

        font-size: 12px;
        font-weight: 700;

        text-decoration: none !important;
    }

    .changelink:hover {
        background: var(--wf-primary-dark) !important;

        color: white !important;
    }


    /* =========================================================
       CHANGE LIST
       ========================================================= */

    #result_list {
        background: var(--wf-white);

        border: 1px solid var(--wf-border);

        border-radius: 10px;

        overflow: hidden;
    }

    #result_list thead th {
        background: var(--wf-primary);

        color: white !important;

        font-weight: 700;
    }

    #result_list tbody tr:hover {
        background: #f0fbfc;
    }

    #result_list tbody td,
    #result_list tbody th {
        color: var(--wf-text);
    }


    /* =========================================================
       FILTER PANEL
       ========================================================= */

    #changelist-filter {
        background: var(--wf-white);

        border-left: 1px solid var(--wf-border);
    }

    #changelist-filter h2 {
        background: var(--wf-primary);

        color: white !important;

        padding: 13px;
    }

    #changelist-filter h3 {
        color: var(--wf-text);
    }


    /* =========================================================
       SEARCH BAR
       ========================================================= */

    #toolbar {
        background: var(--wf-white);

        border: 1px solid var(--wf-border);

        border-radius: 10px;

        padding: 12px;

        margin-bottom: 18px;
    }


    /* =========================================================
       FORM FIELDS
       ========================================================= */

    input,
    textarea,
    select {
        color: var(--wf-text) !important;

        background: var(--wf-white) !important;

        border: 1px solid #d1d5db;

        border-radius: 7px;

        padding: 9px;
    }

    select option {
        color: var(--wf-text);

        background: var(--wf-white);
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--wf-primary);

        outline: none;

        box-shadow:
            0 0 0 2px rgba(22, 138, 173, 0.15);
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    .button,
    input[type="submit"],
    input[type="button"] {
        background: var(--wf-primary);

        border: none;

        border-radius: 7px;

        color: white !important;

        font-weight: 600;

        padding: 10px 16px;

        cursor: pointer;
    }

    .button:hover,
    input[type="submit"]:hover,
    input[type="button"]:hover {
        background: var(--wf-primary-dark);
    }


    /* =========================================================
       SAVE BUTTON ROW
       ========================================================= */

    .submit-row {
        display: flex !important;

        align-items: center;

        flex-wrap: wrap;

        gap: 10px;

        min-height: 60px;

        padding: 14px 16px !important;

        margin: 20px 0 !important;

        background: var(--wf-white) !important;

        border: 1px solid var(--wf-border) !important;

        border-radius: 9px;
    }

    .submit-row input {
        display: inline-block !important;

        visibility: visible !important;

        opacity: 1 !important;

        width: auto !important;

        height: auto !important;

        min-width: 105px;

        min-height: 40px;

        padding: 10px 16px !important;

        margin: 0 !important;

        border: none !important;

        border-radius: 7px !important;

        color: white !important;

        font-size: 14px !important;

        font-weight: 700 !important;

        cursor: pointer;
    }

    .submit-row input[name="_save"] {
        background: var(--wf-success) !important;
    }

    .submit-row input[name="_save"]:hover {
        background: #166534 !important;
    }

    .submit-row input[name="_addanother"],
    .submit-row input[name="_continue"] {
        background: var(--wf-primary) !important;
    }

    .submit-row input[name="_addanother"]:hover,
    .submit-row input[name="_continue"]:hover {
        background: var(--wf-primary-dark) !important;
    }


    /* =========================================================
       DELETE
       ========================================================= */

    .deletelink {
        background: var(--wf-danger) !important;

        color: white !important;

        border-radius: 7px;

        padding: 10px 16px;
    }

    .deletelink:hover {
        background: var(--wf-danger-dark) !important;
    }


    /* =========================================================
       OBJECT TOOLS
       ========================================================= */

    .object-tools a {
        background: var(--wf-primary) !important;

        color: white !important;

        border-radius: 7px;

        text-decoration: none !important;
    }

    .object-tools a:hover {
        background: var(--wf-primary-dark) !important;
    }


    /* =========================================================
       INLINE FORMS
       ========================================================= */

    .inline-group {
        background: var(--wf-white);

        border: 1px solid var(--wf-border);

        border-radius: 9px;

        overflow: hidden;

        margin-bottom: 20px;
    }

    .inline-group h2 {
        background: var(--wf-primary);

        color: white !important;
    }


    /* =========================================================
       FORM TEXT
       ========================================================= */

    .form-row,
    .aligned label,
    fieldset,
    fieldset h2,
    fieldset h3 {
        color: var(--wf-text);
    }

    .help,
    .helptext,
    p.help {
        color: var(--wf-muted) !important;
    }


    /* =========================================================
       SUCCESS / ERROR MESSAGES
       ========================================================= */

    ul.messagelist li.success {
        background: var(--wf-success);

        color: white;

        border-radius: 7px;
    }

    ul.messagelist li.error {
        background: var(--wf-danger);

        color: white;

        border-radius: 7px;
    }


    /* =========================================================
       PAGINATION
       ========================================================= */

    .paginator a {
        background: var(--wf-primary);

        color: white !important;

        border-radius: 5px;

        padding: 6px 10px;
    }

    .paginator a:hover {
        background: var(--wf-primary-dark);
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    #footer {
        padding: 25px;

        color: var(--wf-muted);

        text-align: center;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 767px) {

        #header {
            padding: 12px 16px;
        }

        #content {
            padding: 16px;
        }

        .wf-admin-name {
            font-size: 19px;
        }

        .wf-admin-label {
            display: none;
        }

        .wf-admin-icon {
            width: 31px;
            height: 31px;

            font-size: 16px;
        }

        #user-tools {
            font-size: 11px;
        }

        .module {
            overflow-x: auto;
        }

        .submit-row {
            align-items: stretch;

            flex-direction: column;
        }

        .submit-row input {
            width: 100% !important;
        }
    }
</style>

{% endblock %}
