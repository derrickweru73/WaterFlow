{% extends "admin/base.html" %}

{% block title %}WaterFlow Administration{% endblock %}

{% block branding %}

<div id="site-name">
    <a href="{% url 'admin:index' %}">WaterFlow Administration</a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
    /* =========================================================
       WATERFLOW ADMIN
       Colors matched to the WaterFlow React frontend
       ========================================================= */

    :root {
        --wf-primary: #168aad;
        --wf-primary-dark: #126d87;
        --wf-primary-deep: #0f7894;

        --wf-background: #f5f7fa;
        --wf-white: #ffffff;

        --wf-text: #1f2937;
        --wf-muted: #6b7280;

        --wf-border: #e5e7eb;
        --wf-border-dark: #d1d5db;

        --wf-success: #15803d;
        --wf-success-light: #dcfce7;

        --wf-danger: #dc2626;
        --wf-danger-dark: #b91c1c;

        --wf-blue: #2563eb;
        --wf-blue-light: #eff6ff;

        --wf-cyan-light: #ecfeff;
        --wf-gray-light: #f3f4f6;
        --wf-gray-dark: #9ca3af;
    }


    /* =========================================================
       GENERAL PAGE
       ========================================================= */

    html,
    body {
        background: var(--wf-background);
        color: var(--wf-text);
    }

    body {
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;
    }

    a:link,
    a:visited {
        color: var(--wf-primary);
    }

    a:hover,
    a:focus {
        color: var(--wf-primary-dark);
    }


    /* =========================================================
       HEADER
       ========================================================= */

    #header {
        background: var(--wf-primary) !important;
        color: var(--wf-white) !important;
        border-bottom: 4px solid var(--wf-primary-deep);
        padding: 14px 24px;
    }

    #branding {
        display: flex;
        align-items: center;
    }

    #site-name {
        margin: 0;
        padding: 0;
    }

    #site-name a,
    #site-name a:link,
    #site-name a:visited {
        color: var(--wf-white) !important;
        font-size: 23px;
        font-weight: 700;
        text-decoration: none !important;
    }

    #site-name a:hover,
    #site-name a:focus {
        color: #ecfeff !important;
    }

    #user-tools {
        color: #e0f2fe !important;
        font-size: 13px;
    }

    #user-tools a,
    #user-tools a:link,
    #user-tools a:visited {
        color: var(--wf-white) !important;
        text-decoration: none !important;
    }

    #user-tools a:hover,
    #user-tools a:focus {
        color: #ecfeff !important;
    }


    /* =========================================================
       BREADCRUMBS
       ========================================================= */

    div.breadcrumbs {
        background: var(--wf-primary-deep) !important;
        color: var(--wf-white) !important;
        padding: 11px 24px;
    }

    div.breadcrumbs a,
    div.breadcrumbs a:link,
    div.breadcrumbs a:visited {
        color: #ecfeff !important;
    }

    div.breadcrumbs a:hover {
        color: var(--wf-white) !important;
    }


    /* =========================================================
       CONTENT
       ========================================================= */

    #content {
        padding: 24px;
    }

    h1 {
        color: var(--wf-text) !important;
        font-weight: 700;
        margin-bottom: 20px;
    }

    h2,
    h3 {
        color: var(--wf-text) !important;
    }


    /* =========================================================
       DASHBOARD MODULES
       ========================================================= */

    .module {
        background: var(--wf-white) !important;
        border: 1px solid var(--wf-border) !important;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(15, 118, 143, 0.08);
    }

    .module caption,
    .module h2 {
        background: var(--wf-primary) !important;
        color: var(--wf-white) !important;
        padding: 13px 16px;
        font-size: 15px;
        font-weight: 700;
        text-align: left;
    }

    .module caption a,
    .module caption a:link,
    .module caption a:visited {
        color: var(--wf-white) !important;
        text-decoration: none !important;
        font-weight: 700;
    }

    .module caption a:hover {
        color: #ecfeff !important;
    }

    .module table {
        width: 100%;
    }

    .module th {
        color: var(--wf-text) !important;
        font-weight: 600;
        padding: 11px 16px;
    }

    .module td {
        color: var(--wf-text) !important;
        padding: 11px 16px;
    }

    .module tr {
        border-bottom: 1px solid var(--wf-border);
    }

    .module tr:last-child {
        border-bottom: none;
    }


    /* =========================================================
       DASHBOARD MODEL LINKS
       ========================================================= */

    .module th a,
    .module td a,
    .module th a:link,
    .module th a:visited,
    .module td a:link,
    .module td a:visited {
        color: var(--wf-primary) !important;
        font-weight: 600;
        text-decoration: none !important;
    }

    .module th a:hover,
    .module th a:focus,
    .module td a:hover,
    .module td a:focus {
        color: var(--wf-primary-dark) !important;
        text-decoration: underline !important;
    }


    /* =========================================================
       ADD / CHANGE LINKS
       ========================================================= */

    .addlink,
    .addlink:link,
    .addlink:visited {
        display: inline-block;
        background: var(--wf-success) !important;
        color: var(--wf-white) !important;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none !important;
    }

    .addlink:hover,
    .addlink:focus {
        background: #166534 !important;
        color: var(--wf-white) !important;
    }

    .changelink,
    .changelink:link,
    .changelink:visited {
        display: inline-block;
        background: var(--wf-primary) !important;
        color: var(--wf-white) !important;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none !important;
    }

    .changelink:hover,
    .changelink:focus {
        background: var(--wf-primary-dark) !important;
        color: var(--wf-white) !important;
    }


    /* =========================================================
       RECENT ACTIONS
       THIS WAS ONE OF THE AREAS BEING OVERRIDDEN
       ========================================================= */

    #content-main .module ul.actionlist {
        background: var(--wf-white) !important;
    }

    .actionlist {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .actionlist li {
        color: var(--wf-text) !important;
        background: var(--wf-white) !important;
        border-bottom: 1px solid var(--wf-border) !important;
        padding: 10px 14px !important;
    }

    .actionlist li:last-child {
        border-bottom: none !important;
    }

    .actionlist li:hover {
        background: var(--wf-cyan-light) !important;
    }

    .actionlist a,
    .actionlist a:link,
    .actionlist a:visited {
        color: var(--wf-primary) !important;
        font-weight: 600 !important;
        text-decoration: none !important;
    }

    .actionlist a:hover,
    .actionlist a:focus {
        color: var(--wf-primary-dark) !important;
        text-decoration: underline !important;
    }

    .actionlist .mini {
        color: var(--wf-muted) !important;
    }

    .actionlist li .addlink {
        color: var(--wf-success) !important;
        background: transparent !important;
    }

    .actionlist li .changelink {
        color: var(--wf-primary) !important;
        background: transparent !important;
    }

    .quiet {
        color: var(--wf-muted) !important;
    }


    /* =========================================================
       CHANGE LIST
       ========================================================= */

    #result_list {
        border-radius: 8px;
        overflow: hidden;
        background: var(--wf-white) !important;
        border: 1px solid var(--wf-border);
    }

    #result_list thead th {
        background: var(--wf-primary-deep) !important;
        color: var(--wf-white) !important;
    }

    #result_list thead th a,
    #result_list thead th a:link,
    #result_list thead th a:visited {
        color: var(--wf-white) !important;
    }

    #result_list tbody tr:hover {
        background: var(--wf-cyan-light) !important;
    }

    #result_list tbody td,
    #result_list tbody th {
        color: var(--wf-text) !important;
        border-bottom: 1px solid var(--wf-border);
    }

    #result_list tbody td a,
    #result_list tbody th a {
        color: var(--wf-primary) !important;
    }


    /* =========================================================
       FILTER PANEL
       ========================================================= */

    #changelist-filter {
        background: var(--wf-white) !important;
        border-left: 1px solid var(--wf-border) !important;
    }

    #changelist-filter h2 {
        background: var(--wf-primary) !important;
        color: var(--wf-white) !important;
        padding: 12px;
    }

    #changelist-filter h3 {
        color: var(--wf-text) !important;
    }

    #changelist-filter li {
        color: var(--wf-text) !important;
    }

    #changelist-filter a,
    #changelist-filter a:link,
    #changelist-filter a:visited {
        color: var(--wf-primary) !important;
    }

    #changelist-filter a:hover {
        color: var(--wf-primary-dark) !important;
    }


    /* =========================================================
       SEARCH
       ========================================================= */

    #searchbar {
        border: 1px solid var(--wf-border-dark) !important;
        border-radius: 6px;
        background: var(--wf-white) !important;
        color: var(--wf-text) !important;
    }

    #toolbar input[type="submit"] {
        background: var(--wf-primary) !important;
        color: var(--wf-white) !important;
    }

    #toolbar input[type="submit"]:hover {
        background: var(--wf-primary-dark) !important;
    }


    /* =========================================================
       FORMS
       ========================================================= */

    input,
    textarea,
    select {
        color: var(--wf-text) !important;
        background: var(--wf-white) !important;
        border: 1px solid var(--wf-border-dark) !important;
        border-radius: 6px;
        padding: 8px;
    }

    select option {
        color: var(--wf-text) !important;
        background: var(--wf-white) !important;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--wf-primary) !important;
        outline: none !important;
        box-shadow: 0 0 0 2px rgba(22, 138, 173, 0.15) !important;
    }

    label {
        color: var(--wf-text) !important;
    }

    .help,
    .helptext,
    p.help {
        color: var(--wf-muted) !important;
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    .button,
    input[type="submit"],
    input[type="button"],
    button {
        border: none !important;
        border-radius: 6px !important;
        color: var(--wf-white) !important;
        background: var(--wf-primary) !important;
        font-weight: 600 !important;
        padding: 9px 15px;
        cursor: pointer;
    }

    .button:hover,
    input[type="submit"]:hover,
    input[type="button"]:hover,
    button:hover {
        background: var(--wf-primary-dark) !important;
        color: var(--wf-white) !important;
    }


    /* =========================================================
       SAVE / ADD ANOTHER / CONTINUE
       ========================================================= */

    .submit-row {
        display: flex !important;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        min-height: 60px;
        padding: 14px 16px !important;
        margin: 20px 0 !important;
        background: var(--wf-white) !important;
        border: 1px solid var(--wf-border) !important;
        border-radius: 8px;
    }

    .submit-row input {
        display: inline-block !important;
        visibility: visible !important;
        opacity: 1 !important;
        width: auto !important;
        height: auto !important;
        min-width: 100px;
        min-height: 40px;
        padding: 10px 16px !important;
        margin: 0 !important;
        border: none !important;
        border-radius: 6px !important;
        color: var(--wf-white) !important;
        font-size: 14px !important;
        font-weight: 700 !important;
        cursor: pointer;
    }

    .submit-row input[name="_save"] {
        background: var(--wf-success) !important;
    }

    .submit-row input[name="_save"]:hover {
        background: #166534 !important;
    }

    .submit-row input[name="_addanother"],
    .submit-row input[name="_continue"] {
        background: var(--wf-primary) !important;
    }

    .submit-row input[name="_addanother"]:hover,
    .submit-row input[name="_continue"]:hover {
        background: var(--wf-primary-dark) !important;
    }


    /* =========================================================
       DELETE
       ========================================================= */

    .deletelink,
    .deletelink:link,
    .deletelink:visited {
        background: var(--wf-danger) !important;
        color: var(--wf-white) !important;
        border-radius: 6px;
        padding: 10px 16px;
        text-decoration: none !important;
    }

    .deletelink:hover,
    .deletelink:focus {
        background: var(--wf-danger-dark) !important;
        color: var(--wf-white) !important;
    }


    /* =========================================================
       OBJECT TOOLS
       ========================================================= */

    .object-tools a,
    .object-tools a:link,
    .object-tools a:visited {
        background: var(--wf-primary) !important;
        color: var(--wf-white) !important;
        border-radius: 6px;
        text-decoration: none !important;
    }

    .object-tools a:hover,
    .object-tools a:focus {
        background: var(--wf-primary-dark) !important;
        color: var(--wf-white) !important;
    }


    /* =========================================================
       PAGINATION
       ========================================================= */

    .paginator {
        color: var(--wf-text) !important;
        background: var(--wf-white) !important;
        border-top: 1px solid var(--wf-border);
    }

    .paginator a {
        color: var(--wf-primary) !important;
    }


    /* =========================================================
       INLINE FORMS
       ========================================================= */

    .inline-group {
        border: 1px solid var(--wf-border) !important;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 20px;
        background: var(--wf-white) !important;
    }

    .inline-group h2 {
        background: var(--wf-primary-deep) !important;
        color: var(--wf-white) !important;
    }


    /* =========================================================
       FIELDSETS
       ========================================================= */

    fieldset {
        border-color: var(--wf-border) !important;
    }

    fieldset h2,
    fieldset h3 {
        color: var(--wf-text) !important;
    }

    .form-row {
        color: var(--wf-text) !important;
    }


    /* =========================================================
       MESSAGES
       ========================================================= */

    ul.messagelist li.success {
        background: var(--wf-success-light) !important;
        color: var(--wf-success) !important;
        border-left: 4px solid var(--wf-success);
        border-radius: 6px;
    }

    ul.messagelist li.warning {
        background: #fff7ed !important;
        color: #9a3412 !important;
        border-left: 4px solid #ea580c;
        border-radius: 6px;
    }

    ul.messagelist li.error {
        background: #fee2e2 !important;
        color: var(--wf-danger-dark) !important;
        border-left: 4px solid var(--wf-danger);
        border-radius: 6px;
    }


    /* =========================================================
       ERROR LIST
       ========================================================= */

    ul.errorlist li {
        color: var(--wf-danger) !important;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    #footer {
        padding: 20px;
        color: var(--wf-muted) !important;
        text-align: center;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 767px) {

        #header {
            padding: 12px 16px;
        }

        #content {
            padding: 16px;
        }

        #site-name a {
            font-size: 19px;
        }

        #user-tools {
            font-size: 11px;
        }

        .module {
            overflow-x: auto;
        }

        .submit-row {
            align-items: stretch;
            flex-direction: column;
        }

        .submit-row input {
            width: 100% !important;
        }
    }
</style>

{% endblock %}
