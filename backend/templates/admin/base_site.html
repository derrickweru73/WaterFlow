{% extends "admin/base.html" %}

{% block title %}WaterFlow Administration{% endblock %}

{% block branding %}

<div id="site-name">
    <a href="{% url 'admin:index' %}">WaterFlow Administration</a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
    /* =========================================================
       WATERFLOW COLOR PALETTE
       ========================================================= */

    :root {
        --wf-primary: #168aad;
        --wf-primary-dark: #126d87;
        --wf-primary-deep: #0f7894;

        --wf-background: #f5f7fa;
        --wf-white: #ffffff;

        --wf-text: #1f2937;
        --wf-muted: #6b7280;

        --wf-border: #e5e7eb;
        --wf-border-dark: #d1d5db;

        --wf-success: #15803d;
        --wf-success-dark: #166534;

        --wf-danger: #dc2626;
        --wf-danger-dark: #b91c1c;

        --wf-cyan-light: #ecfeff;
    }


    /* =========================================================
       PAGE
       ========================================================= */

    body {
        background: var(--wf-background) !important;
        color: var(--wf-text) !important;
    }

    a:link,
    a:visited {
        color: var(--wf-primary);
    }

    a:hover,
    a:focus {
        color: var(--wf-primary-dark);
    }


    /* =========================================================
       HEADER
       ========================================================= */

    #header {
        background: var(--wf-primary) !important;
        color: #ffffff !important;
        border-bottom: 4px solid var(--wf-primary-deep) !important;
    }

    #site-name a,
    #site-name a:link,
    #site-name a:visited {
        color: #ffffff !important;
        text-decoration: none !important;
        font-size: 23px;
        font-weight: 700;
    }

    #site-name a:hover {
        color: #ecfeff !important;
    }

    #user-tools,
    #user-tools a,
    #user-tools a:link,
    #user-tools a:visited {
        color: #ffffff !important;
    }

    #user-tools a:hover {
        color: #ecfeff !important;
    }


    /* =========================================================
       BREADCRUMBS
       ========================================================= */

    div.breadcrumbs {
        background: var(--wf-primary-deep) !important;
        color: #ffffff !important;
    }

    div.breadcrumbs a,
    div.breadcrumbs a:link,
    div.breadcrumbs a:visited {
        color: #ecfeff !important;
    }


    /* =========================================================
       MAIN CONTENT
       ========================================================= */

    #content {
        padding: 24px;
    }

    h1,
    h2,
    h3 {
        color: var(--wf-text) !important;
    }


    /* =========================================================
       DASHBOARD MODULES
       ========================================================= */

    .module {
        background: #ffffff !important;
        border: 1px solid var(--wf-border) !important;
        border-radius: 10px !important;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(15, 118, 143, 0.08);
    }

    .module caption,
    .module h2 {
        background: var(--wf-primary) !important;
        color: #ffffff !important;
    }

    .module caption a,
    .module caption a:link,
    .module caption a:visited {
        color: #ffffff !important;
    }

    .module th,
    .module td {
        color: var(--wf-text) !important;
        border-bottom-color: var(--wf-border) !important;
    }


    /* =========================================================
       IMPORTANT:
       DJANGO ADMIN ADD / CHANGE ACTION BUTTONS
       ========================================================= */

    /* ADD */

    .addlink,
    a.addlink,
    a.addlink:link,
    a.addlink:visited {
        display: inline-block !important;
        visibility: visible !important;
        opacity: 1 !important;

        background: var(--wf-success) !important;
        background-image: none !important;

        color: #ffffff !important;

        border: none !important;
        border-radius: 6px !important;

        padding: 6px 12px !important;
        margin: 0 !important;

        min-width: 48px !important;
        min-height: 28px !important;

        font-size: 12px !important;
        font-weight: 700 !important;

        line-height: 16px !important;
        text-align: center !important;
        text-decoration: none !important;

        box-sizing: border-box !important;
    }

    .addlink:hover,
    .addlink:focus,
    a.addlink:hover,
    a.addlink:focus {
        background: var(--wf-success-dark) !important;
        background-image: none !important;
        color: #ffffff !important;
        text-decoration: none !important;
    }


    /* CHANGE */

    .changelink,
    a.changelink,
    a.changelink:link,
    a.changelink:visited {
        display: inline-block !important;
        visibility: visible !important;
        opacity: 1 !important;

        background: var(--wf-primary) !important;
        background-image: none !important;

        color: #ffffff !important;

        border: none !important;
        border-radius: 6px !important;

        padding: 6px 12px !important;
        margin: 0 !important;

        min-width: 58px !important;
        min-height: 28px !important;

        font-size: 12px !important;
        font-weight: 700 !important;

        line-height: 16px !important;
        text-align: center !important;
        text-decoration: none !important;

        box-sizing: border-box !important;
    }

    .changelink:hover,
    .changelink:focus,
    a.changelink:hover,
    a.changelink:focus {
        background: var(--wf-primary-dark) !important;
        background-image: none !important;
        color: #ffffff !important;
        text-decoration: none !important;
    }


    /* =========================================================
       DASHBOARD MODEL ROWS
       ========================================================= */

    #content-main .module td {
        vertical-align: middle !important;
    }

    #content-main .module td a:not(.addlink):not(.changelink) {
        color: var(--wf-primary) !important;
        font-weight: 600;
        text-decoration: none !important;
    }

    #content-main .module td a:not(.addlink):not(.changelink):hover {
        color: var(--wf-primary-dark) !important;
        text-decoration: underline !important;
    }


    /* =========================================================
       RECENT ACTIONS
       ========================================================= */

    #content-related {
        background: transparent !important;
    }

    #content-related .module {
        background: #ffffff !important;
    }

    #content-related .module h2 {
        background: var(--wf-primary) !important;
        color: #ffffff !important;
    }

    #content-related .actionlist {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    #content-related .actionlist li {
        background: #ffffff !important;
        color: var(--wf-text) !important;
        border-bottom: 1px solid var(--wf-border) !important;
    }

    #content-related .actionlist li:hover {
        background: var(--wf-cyan-light) !important;
    }

    #content-related .actionlist a,
    #content-related .actionlist a:link,
    #content-related .actionlist a:visited {
        color: var(--wf-primary) !important;
        font-weight: 600 !important;
    }

    #content-related .actionlist a:hover {
        color: var(--wf-primary-dark) !important;
    }

    #content-related .mini {
        color: var(--wf-muted) !important;
    }


    /* =========================================================
       CHANGE LIST TABLE
       ========================================================= */

    #result_list {
        background: #ffffff !important;
        border: 1px solid var(--wf-border) !important;
        border-radius: 8px !important;
    }

    #result_list thead th {
        background: var(--wf-primary-deep) !important;
        color: #ffffff !important;
    }

    #result_list thead th a,
    #result_list thead th a:link,
    #result_list thead th a:visited {
        color: #ffffff !important;
    }

    #result_list tbody tr:hover {
        background: var(--wf-cyan-light) !important;
    }

    #result_list tbody td,
    #result_list tbody th {
        color: var(--wf-text) !important;
        border-bottom: 1px solid var(--wf-border) !important;
    }


    /* =========================================================
       FORM INPUTS
       ========================================================= */

    input,
    textarea,
    select {
        color: var(--wf-text) !important;
        background: #ffffff !important;
        border: 1px solid var(--wf-border-dark) !important;
        border-radius: 6px !important;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--wf-primary) !important;
        outline: none !important;
        box-shadow: 0 0 0 2px rgba(22, 138, 173, 0.15) !important;
    }


    /* =========================================================
       SAVE BUTTONS
       ========================================================= */

    .submit-row {
        display: flex !important;
        align-items: center !important;
        flex-wrap: wrap !important;
        gap: 10px !important;

        background: #ffffff !important;
        border: 1px solid var(--wf-border) !important;
        border-radius: 8px !important;

        padding: 14px 16px !important;
    }

    .submit-row input {
        display: inline-block !important;
        visibility: visible !important;
        opacity: 1 !important;

        width: auto !important;
        height: auto !important;

        min-width: 100px !important;
        min-height: 40px !important;

        border: none !important;
        border-radius: 6px !important;

        color: #ffffff !important;
        font-weight: 700 !important;
        cursor: pointer !important;
    }

    .submit-row input[name="_save"] {
        background: var(--wf-success) !important;
    }

    .submit-row input[name="_save"]:hover {
        background: var(--wf-success-dark) !important;
    }

    .submit-row input[name="_addanother"],
    .submit-row input[name="_continue"] {
        background: var(--wf-primary) !important;
    }

    .submit-row input[name="_addanother"]:hover,
    .submit-row input[name="_continue"]:hover {
        background: var(--wf-primary-dark) !important;
    }


    /* =========================================================
       DELETE
       ========================================================= */

    .deletelink,
    .deletelink:link,
    .deletelink:visited {
        background: var(--wf-danger) !important;
        color: #ffffff !important;
        border-radius: 6px !important;
        text-decoration: none !important;
    }

    .deletelink:hover,
    .deletelink:focus {
        background: var(--wf-danger-dark) !important;
        color: #ffffff !important;
    }


    /* =========================================================
       OBJECT TOOLS
       ========================================================= */

    .object-tools a,
    .object-tools a:link,
    .object-tools a:visited {
        background: var(--wf-primary) !important;
        color: #ffffff !important;
        border-radius: 6px !important;
    }

    .object-tools a:hover {
        background: var(--wf-primary-dark) !important;
        color: #ffffff !important;
    }


    /* =========================================================
       FILTER
       ========================================================= */

    #changelist-filter {
        background: #ffffff !important;
        border-left: 1px solid var(--wf-border) !important;
    }

    #changelist-filter h2 {
        background: var(--wf-primary) !important;
        color: #ffffff !important;
    }

    #changelist-filter h3 {
        color: var(--wf-text) !important;
    }


    /* =========================================================
       MESSAGES
       ========================================================= */

    ul.messagelist li.success {
        background: #dcfce7 !important;
        color: var(--wf-success) !important;
        border-left: 4px solid var(--wf-success) !important;
    }

    ul.messagelist li.error {
        background: #fee2e2 !important;
        color: var(--wf-danger-dark) !important;
        border-left: 4px solid var(--wf-danger) !important;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    #footer {
        color: var(--wf-muted) !important;
        text-align: center;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 767px) {

        #header {
            padding: 12px 16px;
        }

        #content {
            padding: 16px;
        }

        #site-name a {
            font-size: 19px;
        }

        .submit-row {
            flex-direction: column !important;
            align-items: stretch !important;
        }

        .submit-row input {
            width: 100% !important;
        }

        .addlink,
        .changelink {
            min-width: 70px !important;
        }
    }
</style>

{% endblock %}
