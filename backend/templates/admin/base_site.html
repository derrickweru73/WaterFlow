{% extends "admin/base.html" %}

{% block title %}WaterFlow Administration{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">WaterFlow Administration</a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
    :root {
        --primary: #0284C7;
        --primary-dark: #0369A1;
        --navy: #0F172A;
        --slate: #1E293B;
        --background: #F8FAFC;
        --white: #FFFFFF;
        --success: #16A34A;
        --warning: #F59E0B;
        --danger: #EF4444;
        --text: #0F172A;
        --muted: #64748B;
        --border: #E2E8F0;
    }

    body {
        background: var(--background);
        color: var(--text);
    }

    #content {
        padding: 24px;
    }

    #header {
        background: var(--navy);
        color: white;
        padding: 12px 24px;
        border-bottom: 4px solid var(--primary);
    }

    #site-name {
        padding: 0;
        margin: 0;
    }

    #site-name a {
        color: white;
        font-size: 24px;
        font-weight: 700;
        text-decoration: none;
    }

    #site-name a:hover {
        color: #BAE6FD;
    }

    #user-tools {
        color: #CBD5E1;
        font-size: 13px;
    }

    #user-tools a {
        color: white;
    }

    #user-tools a:hover {
        color: #7DD3FC;
    }

    div.breadcrumbs {
        background: var(--slate);
        color: #CBD5E1;
        padding: 12px 24px;
    }

    div.breadcrumbs a {
        color: #7DD3FC;
    }

    h1 {
        color: var(--navy);
        font-weight: 700;
        margin-bottom: 20px;
    }

    h2 {
        color: var(--navy);
    }

    h3 {
        color: var(--slate);
    }

    a:link,
    a:visited {
        color: var(--primary);
    }

    a:hover {
        color: var(--primary-dark);
    }

    .module {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .module caption,
    .module h2 {
        background: var(--primary);
        color: white;
        font-weight: 600;
        padding: 12px 16px;
    }

    .module th {
        color: var(--text);
    }

    .module td {
        color: var(--muted);
    }

    .addlink,
    .changelink {
        color: var(--primary) !important;
        font-weight: 600;
    }

    .addlink:hover,
    .changelink:hover {
        color: var(--primary-dark) !important;
    }

    input[type="submit"],
    .submit-row input,
    .button {
        background: var(--primary);
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: 600;
        padding: 10px 16px;
    }

    input[type="submit"]:hover,
    .submit-row input:hover,
    .button:hover {
        background: var(--primary-dark);
    }

    input[name="_save"] {
        background: var(--success);
    }

    input[name="_save"]:hover {
        background: #15803D;
    }

    .deletelink {
        background: var(--danger) !important;
        color: white !important;
        border-radius: 6px;
        padding: 10px 16px;
    }

    .deletelink:hover {
        background: #DC2626 !important;
    }

    input,
    textarea,
    select {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    #result_list {
        border-radius: 8px;
        overflow: hidden;
    }

    #result_list thead th {
        background: var(--slate);
        color: white;
    }

    #result_list tbody tr:hover {
        background: #F0F9FF;
    }

    .object-tools a {
        background: var(--primary);
        border-radius: 6px;
    }

    .object-tools a:hover {
        background: var(--primary-dark);
    }

    ul.messagelist li.success {
        background: var(--success);
        color: white;
        border-radius: 6px;
    }

    ul.messagelist li.warning {
        background: var(--warning);
        color: var(--navy);
        border-radius: 6px;
    }

    ul.messagelist li.error {
        background: var(--danger);
        color: white;
        border-radius: 6px;
    }

    #changelist-filter {
        background: white;
        border-left: 1px solid var(--border);
    }

    #changelist-filter h2 {
        background: var(--navy);
        color: white;
        padding: 12px;
    }

    .paginator a {
        background: var(--primary);
        color: white !important;
        border-radius: 4px;
        padding: 6px 10px;
    }

    .paginator a:hover {
        background: var(--primary-dark);
    }

    .inline-group {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .inline-group h2 {
        background: var(--slate);
        color: white;
    }

    #footer {
        padding: 20px;
        color: var(--muted);
        text-align: center;
    }
</style>
{% endblock %}
