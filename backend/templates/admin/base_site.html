{% extends "admin/base.html" %}

{% block title %}WaterFlow Administration{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">WaterFlow Administration</a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
    :root {
        --primary: #0284C7;
        --primary-dark: #0369A1;
        --navy: #0F172A;
        --slate: #1E293B;
        --background: #F8FAFC;
        --white: #FFFFFF;
        --success: #16A34A;
        --warning: #F59E0B;
        --danger: #EF4444;
        --text: #0F172A;
        --muted: #64748B;
        --border: #E2E8F0;
    }

    body {
        background: var(--background);
        color: var(--text);
    }

    #content {
        padding: 24px;
    }

    #header {
        background: var(--navy);
        color: white;
        padding: 12px 24px;
        border-bottom: 4px solid var(--primary);
    }

    #site-name {
        padding: 0;
        margin: 0;
    }

    #site-name a {
        color: white;
        font-size: 24px;
        font-weight: 700;
        text-decoration: none;
    }

    #site-name a:hover {
        color: #BAE6FD;
    }

    #user-tools {
        color: #CBD5E1;
        font-size: 13px;
    }

    #user-tools a {
        color: white;
    }

    #user-tools a:hover {
        color: #7DD3FC;
    }

    div.breadcrumbs {
        background: var(--slate);
        color: #CBD5E1;
        padding: 12px 24px;
    }

    div.breadcrumbs a {
        color: #7DD3FC;
    }

    h1 {
        color: var(--navy);
        font-weight: 700;
        margin-bottom: 20px;
    }

    h2 {
        color: var(--navy);
    }

    h3 {
        color: var(--slate);
    }

    a:link,
    a:visited {
        color: var(--primary);
    }

    a:hover {
        color: var(--primary-dark);
    }

    .module {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .module caption,
    .module h2 {
        background: var(--primary);
        color: white;
        font-weight: 600;
        padding: 12px 16px;
    }

    .module th {
        color: var(--text);
    }

    .module td {
        color: var(--muted);
    }

    .addlink,
    .changelink {
        color: var(--primary) !important;
        font-weight: 600;
    }

    .addlink:hover,
    .changelink:hover {
        color: var(--primary-dark) !important;
    }

    input[type="submit"],
    .submit-row input,
    .button {
        background: var(--primary);
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: 600;
        padding: 10px 16px;
    }

    input[type="submit"]:hover,
    .submit-row input:hover,
    .button:hover {
        background: var(--primary-dark);
    }

    input[name="_save"] {
        background: var(--success);
    }

    input[name="_save"]:hover {
        background: #15803D;
    }

    .deletelink {
        background: var(--danger) !important;
        color: white !important;
        border-radius: 6px;
        padding: 10px 16px;
    }

    .deletelink:hover {
        background: #DC2626 !important;
    }

    input,
    textarea,
    select {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    #result_list {
        border-radius: 8px;
        overflow: hidden;
    }

    #result_list thead th {
        background: var(--slate);
        color: white;
    }

    #result_list tbody tr:hover {
        background: #F0F9FF;
    }

    .object-tools a {
        background: var(--primary);
        border-radius: 6px;
    }

    .object-tools a:hover {
        background: var(--primary-dark);
    }

    ul.messagelist li.success {
        background: var(--success);
        color: white;
        border-radius: 6px;
    }

    ul.messagelist li.warning {
        background: var(--warning);
        color: var(--navy);
        border-radius: 6px;
    }

    ul.messagelist li.error {
        background: var(--danger);
        color: white;
        border-radius: 6px;
    }

    #changelist-filter {
        background: white;
        border-left: 1px solid var(--border);
    }

    #changelist-filter h2 {
        background: var(--navy);
        color: white;
        padding: 12px;
    }

    .paginator a {
        background: var(--primary);
        color: white !important;
        border-radius: 4px;
        padding: 6px 10px;
    }

    .paginator a:hover {
        background: var(--primary-dark);
    }

    .inline-group {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .inline-group h2 {
        background: var(--slate);
        color: white;
    }

    #footer {
        padding: 20px;
        color: var(--muted);
        text-align: center;
    }

    #content-main {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
}

#content-main .module {
    margin-bottom: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--white);
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
}

#content-main .module caption {
    background: var(--navy);
    color: white;
    text-align: left;
    font-size: 16px;
    font-weight: 700;
    padding: 15px 18px;
}

#content-main .module caption a {
    color: white;
    text-decoration: none;
}

#content-main .module tr {
    border-bottom: 1px solid var(--border);
}

#content-main .module tr:last-child {
    border-bottom: none;
}

#content-main .module th {
    padding: 13px 16px;
    font-weight: 600;
}

#content-main .module td {
    padding: 13px 10px;
}

#content-main .module td a {
    font-weight: 600;
}

#content-main .addlink {
    background: var(--success);
    color: white !important;
    padding: 6px 10px;
    border-radius: 5px;
    text-decoration: none;
    font-size: 12px;
}

#content-main .addlink:hover {
    background: #15803D;
}

#content-main .changelink {
    background: var(--primary);
    color: white !important;
    padding: 6px 10px;
    border-radius: 5px;
    text-decoration: none;
    font-size: 12px;
}

#content-main .changelink:hover {
    background: var(--primary-dark);
}

#content-related {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-top: 20px;
}

#content-related h2 {
    color: var(--navy);
    font-size: 16px;
}

@media (max-width: 900px) {
    #content-main {
        grid-template-columns: 1fr;
    }
}

#content-main .module caption {
    display: block !important;
    background: var(--primary) !important;
    color: white !important;
    padding: 15px 18px !important;
    text-align: left !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    line-height: 1.4 !important;
    height: auto !important;
    min-height: 20px !important;
}

#content-main .module caption a {
    display: block !important;
    color: white !important;
    background: transparent !important;
    text-decoration: none !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    line-height: 1.4 !important;
    text-indent: 0 !important;
    visibility: visible !important;
    opacity: 1 !important;
}

#content-main .module caption a:hover {
    color: white !important;
    background: transparent !important;
}

#content-main .module caption a:visited {
    color: white !important;
}

body,
body input,
body textarea,
body select,
body button,
body table,
body th,
body td,
body label,
body p,
body li {
    color: var(--text);
}

a,
a:link,
a:visited {
    color: var(--primary) !important;
}

a:hover,
a:focus {
    color: var(--primary-dark) !important;
}

fieldset h2,
fieldset h3,
.form-row label,
.aligned label,
.selector-chosen h2,
.selector-available h2 {
    color: var(--navy) !important;
}

fieldset,
.inline-group,
.form-row {
    color: var(--text);
}

.help,
.helptext,
p.help,
.form-row .help {
    color: var(--muted) !important;
}

select,
input,
textarea {
    color: var(--text) !important;
    background: var(--white) !important;
}

select option {
    color: var(--text);
    background: var(--white);
}

.related-widget-wrapper a {
    color: var(--primary) !important;
}

.related-widget-wrapper a:hover {
    color: var(--primary-dark) !important;
}

.submit-row {
    background: var(--background);
    border: 1px solid var(--border);
}

.submit-row input {
    color: white !important;
}

.delete-confirmation,
.delete-confirmation p {
    color: var(--text);
}
</style>
{% endblock %}
