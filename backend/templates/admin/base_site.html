{% extends "admin/base.html" %}

{% block title %}WaterFlow Administration{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">WaterFlow Administration</a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
    :root {
        --primary: #0284C7;
        --primary-dark: #0369A1;
        --navy: #0F172A;
        --slate: #1E293B;
        --background: #F8FAFC;
        --white: #FFFFFF;
        --success: #16A34A;
        --success-dark: #15803D;
        --warning: #F59E0B;
        --danger: #EF4444;
        --danger-dark: #DC2626;
        --text: #0F172A;
        --muted: #64748B;
        --border: #E2E8F0;
    }

    body {
        background: var(--background);
        color: var(--text);
    }

    #header {
        background: var(--navy);
        color: var(--white);
        padding: 14px 24px;
        border-bottom: 4px solid var(--primary);
    }

    #site-name {
        margin: 0;
        padding: 0;
    }

    #site-name a {
        color: var(--white) !important;
        font-size: 24px;
        font-weight: 700;
        text-decoration: none !important;
    }

    #site-name a:hover {
        color: #BAE6FD !important;
    }

    #user-tools {
        color: #CBD5E1;
        font-size: 13px;
    }

    #user-tools a {
        color: var(--white) !important;
    }

    #user-tools a:hover {
        color: #7DD3FC !important;
    }

    div.breadcrumbs {
        background: var(--slate);
        color: #CBD5E1;
        padding: 12px 24px;
    }

    div.breadcrumbs a {
        color: #7DD3FC !important;
    }

    #content {
        padding: 24px;
    }

    h1 {
        color: var(--navy);
        font-weight: 700;
        margin-bottom: 20px;
    }

    h2,
    h3 {
        color: var(--navy);
    }

    a,
    a:link,
    a:visited {
        color: var(--primary) !important;
    }

    a:hover,
    a:focus {
        color: var(--primary-dark) !important;
    }

    .module {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
    }

    .module caption,
    .module h2 {
        background: var(--primary);
        color: var(--white) !important;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 700;
        text-align: left;
    }

    .module caption a,
    .module caption a:link,
    .module caption a:visited {
        display: block;
        color: var(--white) !important;
        background: transparent !important;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none !important;
        opacity: 1 !important;
        visibility: visible !important;
    }

    .module caption a:hover,
    .module caption a:focus {
        color: var(--white) !important;
        background: transparent !important;
    }

    .module table {
        width: 100%;
    }

    .module th {
        color: var(--text) !important;
        font-weight: 700;
        padding: 12px 16px;
    }

    .module td {
        color: var(--text) !important;
        padding: 12px 16px;
    }

    .module th a,
    .module th a:link,
    .module th a:visited,
    .module td a,
    .module td a:link,
    .module td a:visited {
        color: var(--primary) !important;
        font-weight: 700 !important;
        text-decoration: underline !important;
        opacity: 1 !important;
        visibility: visible !important;
    }

    .module th a:hover,
    .module th a:focus,
    .module td a:hover,
    .module td a:focus {
        color: var(--primary-dark) !important;
    }

    .module tr {
        border-bottom: 1px solid var(--border);
    }

    .module tr:last-child {
        border-bottom: none;
    }

    .addlink {
        background: var(--success) !important;
        color: var(--white) !important;
        border-radius: 5px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 700 !important;
        text-decoration: none !important;
    }

    .addlink:hover {
        background: var(--success-dark) !important;
        color: var(--white) !important;
    }

    .changelink {
        background: var(--primary) !important;
        color: var(--white) !important;
        border-radius: 5px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 700 !important;
        text-decoration: none !important;
    }

    .changelink:hover {
        background: var(--primary-dark) !important;
        color: var(--white) !important;
    }

    input,
    textarea,
    select {
        color: var(--text) !important;
        background: var(--white) !important;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
    }

    select option {
        color: var(--text) !important;
        background: var(--white) !important;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--primary);
        outline: none;
        box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    input[type="submit"],
    .submit-row input,
    .button {
        background: var(--primary);
        border: none;
        border-radius: 6px;
        color: var(--white) !important;
        font-weight: 700;
        padding: 10px 16px;
    }

    input[type="submit"]:hover,
    .submit-row input:hover,
    .button:hover {
        background: var(--primary-dark);
    }

    input[name="_save"] {
        background: var(--success);
    }

    input[name="_save"]:hover {
        background: var(--success-dark);
    }

    .deletelink {
        background: var(--danger) !important;
        color: var(--white) !important;
        border-radius: 6px;
        padding: 10px 16px;
    }

    .deletelink:hover {
        background: var(--danger-dark) !important;
    }

    .submit-row {
        background: var(--background);
        border: 1px solid var(--border);
    }

    .object-tools a {
        background: var(--primary) !important;
        color: var(--white) !important;
        border-radius: 6px;
    }

    .object-tools a:hover {
        background: var(--primary-dark) !important;
        color: var(--white) !important;
    }

    #result_list {
        border-radius: 8px;
        overflow: hidden;
    }

    #result_list thead th {
        background: var(--slate);
        color: var(--white) !important;
    }

    #result_list tbody tr:hover {
        background: #F0F9FF;
    }

    #changelist-filter {
        background: var(--white);
        border-left: 1px solid var(--border);
    }

    #changelist-filter h2 {
        background: var(--navy);
        color: var(--white) !important;
        padding: 12px;
    }

    .paginator a {
        background: var(--primary);
        color: var(--white) !important;
        border-radius: 4px;
        padding: 6px 10px;
    }

    .paginator a:hover {
        background: var(--primary-dark);
    }

    .inline-group {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .inline-group h2 {
        background: var(--slate);
        color: var(--white) !important;
    }

    .form-row,
    .aligned label,
    fieldset,
    fieldset h2,
    fieldset h3 {
        color: var(--text) !important;
    }

    .help,
    .helptext,
    p.help {
        color: var(--muted) !important;
    }

    ul.messagelist li.success {
        background: var(--success);
        color: var(--white);
        border-radius: 6px;
    }

    ul.messagelist li.warning {
        background: var(--warning);
        color: var(--navy);
        border-radius: 6px;
    }

    ul.messagelist li.error {
        background: var(--danger);
        color: var(--white);
        border-radius: 6px;
    }

    #footer {
        padding: 20px;
        color: var(--muted);
        text-align: center;
    }
</style>
{% endblock %}
